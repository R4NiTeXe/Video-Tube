name: Auto Deploy Frontend & Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      # =========================
      # FRONTEND QUALITY CHECKS
      # =========================

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: Frontend
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: Frontend
        run: npm test

      - name: Build frontend
        working-directory: Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://video-tube-hf5y.onrender.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://video-tube-asjv.vercel.app

      - name: E2E smoke tests
        working-directory: Frontend
        run: npx playwright install --with-deps chromium && npm run e2e -- --project=chromium
        env:
          NEXT_PUBLIC_API_BASE_URL: https://video-tube-hf5y.onrender.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://video-tube-asjv.vercel.app

      # =========================
      # BACKEND QUALITY CHECKS
      # =========================

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Lint backend
        working-directory: Backend
        run: npm run lint

      - name: Test backend
        working-directory: Backend
        run: npm run test:coverage

  # =========================
  # DEPLOY FRONTEND TO VERCEL
  # =========================

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: Frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build project
        working-directory: Frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        working-directory: Frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

  # =========================
  # DEPLOY BACKEND TO RENDER
  # =========================

  deploy-backend:
    name: Deploy Backend to Render
    needs: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
